<svg xmlns="http://www.w3.org/2000/svg" width="960" height="430" viewBox="0 0 960 430" role="img" aria-labelledby="title desc">
  <title id="title">Codex Usage 菜单栏运行效果示意</title>
  <desc id="desc">菜单栏以两行紧凑展示五小时和周额度，展开菜单显示剩余额度、刷新时间和操作项。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#202124"/>
      <stop offset="1" stop-color="#111214"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.38"/>
    </filter>
  </defs>

  <rect width="960" height="430" rx="22" fill="url(#page)"/>
  <rect width="960" height="54" rx="22" fill="#050505"/>
  <rect y="36" width="960" height="18" fill="#050505"/>

  <text x="32" y="34" fill="#f5f5f7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="650">Codex Usage</text>

  <rect x="665" y="5" width="142" height="44" rx="10" fill="#29292b" stroke="#47474b"/>
  <text x="677" y="22" fill="#ffffff" font-family="SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">5h 92% ↻2h23m</text>
  <text x="677" y="40" fill="#ffffff" font-family="SFMono-Regular, Menlo, monospace" font-size="13" font-weight="600">W  91% ↻4d17h</text>
  <circle cx="845" cy="27" r="11" fill="none" stroke="#d9d9dc" stroke-width="3"/>
  <circle cx="894" cy="27" r="11" fill="#d9d9dc"/>
  <circle cx="929" cy="27" r="8" fill="#d9d9dc"/>

  <g filter="url(#shadow)">
    <rect x="492" y="66" width="422" height="326" rx="18" fill="#242426" stroke="#55555a" stroke-width="1.5"/>
  </g>

  <text x="526" y="112" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="23" font-weight="650">5 小时额度：92% 剩余</text>
  <text x="526" y="146" fill="#b9b9bf" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17">刷新：01:10 · 2h 23m 后</text>
  <line x1="512" y1="169" x2="894" y2="169" stroke="#454549"/>

  <text x="526" y="209" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="23" font-weight="650">周额度：91% 剩余</text>
  <text x="526" y="243" fill="#b9b9bf" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="17">刷新：Sep 19, 16:15 · 4d 17h 后</text>
  <text x="526" y="280" fill="#8f8f95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">最后同步：刚刚</text>
  <line x1="512" y1="300" x2="894" y2="300" stroke="#454549"/>

  <text x="526" y="334" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">Refresh Now</text>
  <text x="526" y="367" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18">✓ Launch at Login</text>
  <text x="792" y="367" fill="#8f8f95" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Quit</text>

  <text x="32" y="403" fill="#7f8085" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">运行效果示意 · 数值会根据你的 Codex 账户实时变化</text>
</svg>
